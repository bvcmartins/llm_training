---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-storage
  namespace: mlflow
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path        # k3s ships local-path-provisioner as default
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-server
  namespace: mlflow
  labels: { app: mlflow-server }
spec:
  replicas: 1
  strategy: { type: Recreate }        # single RWO volume + SQLite — never run two pods at once
  selector:
    matchLabels: { app: mlflow-server }
  template:
    metadata:
      labels: { app: mlflow-server }
    spec:
      containers:
        - name: mlflow-server
          image: ghcr.io/mlflow/mlflow:v3.15.2
          command:
            - mlflow
            - server
            - --backend-store-uri
            - sqlite:////mlflow-data/mlflow.db
            # mlflow-artifacts:/ (not a plain filesystem path) tells clients to
            # route artifact reads/writes through this server's proxy API,
            # backed on-disk by --artifacts-destination. A plain path here
            # instead makes clients try to open that path directly on their
            # OWN filesystem, which fails for any client that isn't literally
            # inside this pod (confirmed: PermissionError: /mlflow-data from
            # the host trying to log_artifact against a run created before
            # this fix).
            - --default-artifact-root
            - mlflow-artifacts:/
            - --artifacts-destination
            - /mlflow-data/artifacts
            - --host
            - "0.0.0.0"
            - --port
            - "5000"
            - --allowed-hosts
            # NOTE: passing --allowed-hosts REPLACES mlflow's built-in default
            # (localhost + private IPs) rather than extending it, so localhost/
            # 127.0.0.1 must be listed explicitly or they 403 on every route
            # except /health (which is exempt from the host check — that's why
            # curl .../health looked fine here before this was caught).
            - "airig.local,airig.local:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
            - --cors-allowed-origins
            # Same story for CORS: the default only allows localhost origins,
            # so the React UI's own XHR/fetch calls to this API get blocked by
            # the browser once the page itself is loaded via airig.local.
            - "http://airig.local:5000,http://localhost:5000,http://127.0.0.1:5000"
          ports:
            - { name: http, containerPort: 5000 }
          volumeMounts:
            - { name: storage, mountPath: /mlflow-data }
            - { name: shm, mountPath: /dev/shm }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits:   { memory: "2Gi" }
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: mlflow-storage
        # mlflow's server puts its internal job-queue sqlite db (huey - not the
        # tracking-store mlflow.db, which is fine on the PVC) on /dev/shm when
        # available, falling back to a normal tempdir only if /dev/shm doesn't
        # exist at all (mlflow/server/__init__.py). Kubernetes' default /dev/shm
        # is a tiny 64Mi tmpfs, which the job queue silently fills under
        # sustained load (confirmed: enabling log_system_metrics=True in
        # llm_training on 2026-09-05 pushed it over, causing
        # "sqlite3.OperationalError: database or disk is full" and a
        # CrashLoopBackOff — the real mlflow.db on the PVC was untouched and
        # tiny (117MB) the whole time). Give it real room instead of the
        # container-runtime default.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-server
  namespace: mlflow
spec:
  # LoadBalancer => k3s ServiceLB (klipper) binds host port 5000, so the server is
  # reachable at http://airig.local:5000 — same pattern as ragu's :8600.
  type: LoadBalancer
  selector: { app: mlflow-server }
  ports:
    - { name: http, port: 5000, targetPort: 5000 }
